name: Build Release App Bundle

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: create keystore.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: echo "$KEYSTORE" > ./keystore.properties
        # - name: create gradle.properties
        #   env:
        # GRADLE_PROPERTIES: ${{ secrets.GRADLE_PROPERTIES }}
        #run: echo "$GRADLE_PROPERTIES" > ./gradle.properties
      - name: create google_service.json
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
        run: echo "$GOOGLE_SERVICE_JSON" > ./app/google-services.json
      - name: Bump version
        uses: chkfung/android-version-actions@v1.1
        with:
          gradlePath: app/build.gradle.kts # or app/build.gradle.kts
          versionCode: ${{github.run_number}}
          versionName: 2.0.0
      - name: Change wrapper permissions
        run: chmod +x ./gradlew
      - name: Clean
        run: ./gradlew clean
      - name: LintCheck
        run: ./gradlew ktlintCheck
      - name: Build Release App Bundle
        run: ./gradlew app:bundleRelease --stacktrace
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: app/build/outputs/bundle/release/**.aab
      - name: Firebase App Distribution
        uses: hasretsariyer/firebase-app-distribution-github-action@v1.0
        with:
          app_id: ${{secrets.FIREBASE_APP_ID}}
          firebase_token: ${{secrets.FIREBASE_TOKEN}}
          app_file: app/build/outputs/bundle/release/app-release.aab
          tester_groups: maintainers
