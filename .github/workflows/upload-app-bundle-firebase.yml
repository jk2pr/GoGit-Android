name: Build Release App Bundle

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set git safe directory
        run: git config --global --add safe.directory '*'
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > ./Keystore
      - name: create keystore.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: echo "$KEYSTORE" > ./keystore.properties
      - name: create google_service.json
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
        run: echo "$GOOGLE_SERVICE_JSON" > ./app/google-services.json
      - name: Bump version
        uses: chkfung/android-version-actions@v1.1
        with:
          gradlePath: app/build.gradle.kts # or app/build.gradle.kts
          versionCode: ${{github.run_number}}
          versionName: 2.0.0
      - name: Change wrapper permissions
        run: chmod +x ./gradlew
      - name: Clean
        run: ./gradlew clean
      - name: LintCheck
        run: ./gradlew ktlintCheck
      - name: Build Release App Bundle
        run: ./gradlew app:bundleRelease --stacktrace
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: app/build/outputs/bundle/release/**.aab
      - name: Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1.5.1
        with:
          appId: ${{secrets.FIREBASE_APP_ID}}
          token: ${{secrets.FIREBASE_TOKEN}}
          file: app/build/outputs/bundle/release/app-release.aab
          groups: maintainers
